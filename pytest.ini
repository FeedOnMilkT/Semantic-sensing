[pytest]
# phase2 split-computing tests (tests/). Run with:
#   CUDA_VISIBLE_DEVICES="" PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python -m pytest tests/ -q
# PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 dodges a broken hypothesis entrypoint (missing
# pkg_resources) in this NGC image. CUDA off + single-thread (conftest) keeps the
# CPU-only rANS coder off the CUDA context. cacheprovider off keeps the tree clean.
addopts = -p no:cacheprovider
testpaths = tests
