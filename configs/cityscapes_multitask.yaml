# Phase 1b: multi-task seg + depth on Cityscapes (the frozen teacher for Phase 2).
# Target: seg mIoU drops < 2 pts vs single-task; depth RMSE < 8 m.
# Adding the depth head is the only change vs cityscapes_seg.yaml — the trainer
# picks it up automatically (conditional loss), demonstrating acceptance #2/#3.
_base_: base.yaml

num_classes: 19

model:
  backbone:
    name: mit_b0
    args:
      pretrained: /data/sidney/checkpoints/pretrained/mit_b0_imagenet_hf.bin
  heads:
    seg:
      name: seg
      args:
        num_classes: ${num_classes}
        upsample: 4
    depth:
      name: depth
      args:
        max_depth: ${max_depth}
        upsample: 4

train:
  epochs: 200
  batch_size: 8
  optimizer:
    name: adamw
    lr: 6.0e-4
    weight_decay: 0.01

loss:
  weighting:
    name: uncertainty        # auto-balance seg vs depth (Kendall 2018)
  task_losses:
    seg:
      num_classes: ${num_classes}
      ignore_index: ${ignore_index}
    depth:
      min_depth: 1.0e-3
      max_depth: ${max_depth}
      w_grad: 0.1

eval:
  meters:
    seg:
      num_classes: ${num_classes}
      ignore_index: ${ignore_index}
    depth:
      min_depth: 1.0e-3
      max_depth: ${max_depth}

data:
  train:
    name: cityscapes
    args:
      root: /data/sidney/datasets/cityscapes
      split: train
      tasks: [seg, depth]
      size: [512, 1024]
      num_classes: ${num_classes}
      max_depth: ${max_depth}
  val:
    name: cityscapes
    args:
      root: /data/sidney/datasets/cityscapes
      split: val
      tasks: [seg, depth]
      size: [512, 1024]
      num_classes: ${num_classes}
      max_depth: ${max_depth}
